version: 1.2.1+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.0
  get: ^4.7.3
  window_manager: ^0.5.2
  cupertino_icons: ^1.0.9
  bootstrap_icons: ^1.13.1
  syncfusion_flutter_datagrid: ^34.2.3
  syncfusion_flutter_core: ^34.2.3
  date_format: ^2.0.9
  socket_io_client: ^3.1.6
  animated_text_kit: ^4.3.0
  uuid: ^4.6.0
  brasil_fields: ^1.19.0
  number_text_input_formatter: ^1.0.0+9
  device_info_plus: ^12.4.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  ios: false

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  # macos:
  #   generate: true
  #   image_path: "assets/icons/app_icon.png"

